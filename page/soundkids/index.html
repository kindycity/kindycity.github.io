<script language="JavaScript">
  window.onload = function() {
      document.addEventListener("contextmenu", function(e) {
          e.preventDefault();

      document.addEventListener("keydown", function(e) {
          if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
              disabledEvent(e);
          }
          if (e.ctrlKey && e.shiftKey && e.keyCode == 74) {
              disabledEvent(e);
          }
          if (e.keyCode == 83 && (navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)) {
              disabledEvent(e);
          }
          if (e.ctrlKey && e.keyCode == 85) {
              disabledEvent(e);
          }
          if (event.keyCode == 123) {
              disabledEvent(e);
          }
      }, false);

      function disabledEvent(e) {
          if (e.stopPropagation) {
              e.stopPropagation();
          } else if (window.event) {
              window.event.cancelBubble = true;
          }
          e.preventDefault();
          return false;
      }
  };

    <script>
        const trinhPhatAmThanh = new Audio();

        document.addEventListener("DOMContentLoaded", () => {
            taiDuLieuTuGoogleDrive();
            
            let daMoKhoaAI = false;
            document.body.addEventListener('click', function() {
                if (!daMoKhoaAI) {
                    trinhPhatAmThanh.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    trinhPhatAmThanh.play().catch(()=>{});
                    
                    if ('speechSynthesis' in window) {
                        let utterance = new SpeechSynthesisUtterance(''); 
                        window.speechSynthesis.speak(utterance);
                    }
                    daMoKhoaAI = true;
                    console.log("🔓 Trình duyệt di động đã mở khóa hệ thống AI");
                }
            }, { once: true });
        });
        
        async function taiDuLieuTuGoogleDrive() {
            const DRIVE_FILE_ID = "1rO3Br6-g8A_BNPfjvwIFUAs3DgTMc9a4";
            const API_KEY = "AIzaSyBGLYBq1raWQVVFE-LwT09_4WhB9I0nRPI";

            const urlFetch = `https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&key=${API_KEY}`;

            try {
                const response = await fetch(urlFetch);
                if (!response.ok) throw new Error("Không thể tải cấu hình từ Google Drive");
                
                const data = await response.json();
                window.kindergartenData = data;
                
                veGiaoDienHocSinhDong();
            } catch (error) {
                console.error("Lỗi đồng bộ đám mây:", error);
                alert("Hệ thống không thể tải danh sách học sinh từ Google Drive. Vui lòng kiểm tra kết nối mạng hoặc quyền chia sẻ tệp.");
            }
        }

        function veGiaoDienHocSinhDong() {
            if (!window.kindergartenData || !window.kindergartenData.students) return;

            const data = window.kindergartenData;

            data.classes.forEach(className => {
                const container = document.getElementById(`container-${className}`);
                if (container) container.innerHTML = '';
            });

            data.students.forEach(student => {
                const container = document.getElementById(`container-${student.class}`);
                if (!container) return; 

                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'responsive'; 

                cardWrapper.innerHTML = `
                    <div class="gallery" style="cursor: pointer; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px;">
                        <img src="${student.image}" alt="${student.name}" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-bottom: 2px solid #f1f5f9;">
                        <div class="desc" style="padding: 12px 5px; text-align: center; font-weight: bold; font-size: 16px; color: #4f46e5; text-transform: capitalize;">
                            ${student.name}
                        </div>
                    </div>
                `;

                cardWrapper.addEventListener('click', () => {
                    playClickSound(student.sound, student.name, student.class);
                });

                container.appendChild(cardWrapper);
            });
            
            data.classes.forEach(className => {
                const container = document.getElementById(`container-${className}`);
                if (container) {
                    const clearfix = document.createElement('div');
                    clearfix.className = 'clearfix';
                    container.appendChild(clearfix);
                }
            });
        }

        function playClickSound(soundUrl, studentName, className) {
            let cleanUrl = soundUrl ? soundUrl.trim().replace(/\\/g, '/') : '';
            const coFileAmThanh = cleanUrl !== "" && cleanUrl !== "sound/" && !cleanUrl.endsWith('/');

            if (coFileAmThanh) {
                trinhPhatAmThanh.src = cleanUrl;
                trinhPhatAmThanh.play().catch(error => {
                    console.warn("Lỗi tệp MP3 gốc, kích hoạt AI dự phòng:", error);
                    phatThanhAIGiongNu(`Mời học sinh ${studentName} lớp ${className} ra về`);
                });
            } else {
                phatThanhAIGiongNu(`Mời học sinh ${studentName} lớp ${className} ra về`);
            }
        }

        let giongNoiHeThong = [];
        function capNhatHeThongGiong() {
            giongNoiHeThong = window.speechSynthesis.getVoices();
        }
        
        if (window.speechSynthesis) {
            capNhatHeThongGiong();
            window.speechSynthesis.onvoiceschanged = capNhatHeThongGiong;
        }

        function phatThanhAIGiongNu(text) {
            let thanhCongGiongCucBo = false;

            if ('speechSynthesis' in window) {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.99; 

                if (giongNoiHeThong.length === 0) {
                    giongNoiHeThong = window.speechSynthesis.getVoices();
                }

                const giongTiengViet = giongNoiHeThong.filter(voice => voice.lang.includes('vi') || voice.lang.includes('VN'));

                if (giongTiengViet.length > 0) {
                    const locGiongNu = giongTiengViet.filter(voice => !voice.name.includes(' An'));
                    
                    let giongNuChuan = locGiongNu.find(voice => 
                        voice.name.toLowerCase().includes('hoaimy') || 
                        voice.name.toLowerCase().includes('linh') ||
                        voice.name.toLowerCase().includes('google')
                    );

                    if (!giongNuChuan && locGiongNu.length > 0) giongNuChuan = locGiongNu[0];
                    if (!giongNuChuan) giongNuChuan = giongTiengViet[0];

                    if (giongNuChuan) {
                        utterance.voice = giongNuChuan;
                        setTimeout(() => {
                            window.speechSynthesis.speak(utterance);
                        }, 50);
                        thanhCongGiongCucBo = true;
                        console.log("🔊 Phát bằng giọng:", giongNuChuan.name);
                    }
                }
            }

            if (!thanhCongGiongCucBo) {
                console.log("🚀 Chuyển sang AI Cloud TTS Giọng Nữ...");
                const urlCloudTTS = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(text)}`;
                trinhPhatAmThanh.src = urlCloudTTS;
                trinhPhatAmThanh.play().catch(err => {
                    console.error("Lỗi phát âm thanh Cloud:", err);
                });
            }
        }
    </script>
